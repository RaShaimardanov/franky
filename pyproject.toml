[project]
name = "franky"
version = "2.0.0"
description = "Telegram-бот «Фрэнки-шоу»: слушай выпуск и угадывай, чью жизнь прожил ведущий"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.10",
    "structlog>=24.4",
]

[project.scripts]
franky = "franky.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/franky"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "C4", "PT", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма

[tool.ruff.lint.per-file-ignores]
# Разовые CLI-задачи импорта: работают вне цикла событий бота, блокирующий stat/glob не мешает.
"src/franky/catalog/*" = ["ASYNC240"]
"tests/*" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
