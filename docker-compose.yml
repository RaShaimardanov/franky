# Работает и в Coolify (переменные задаются в UI), и локально (`cp .env.example .env`,
# compose сам подставит значения из .env).
#
# Разовые задачи — в контейнере бота (в Coolify: вкладка Terminal):
#   franky sync        обновить каталог выпусков с fshow.info
#   franky download    докачать mp3 в том audio
#   franky upload      заранее залить аудио в Telegram (нужен BOT__STORAGE_CHAT_ID)

x-app-env: &app-env
  DB__DSN: postgresql+asyncpg://${POSTGRES_USER:-franky}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-franky}
  BOT__TOKEN: ${BOT__TOKEN:?}
  BOT__STORAGE_CHAT_ID: ${BOT__STORAGE_CHAT_ID:-}
  BOT__API_SERVER: ${BOT__API_SERVER:-}
  GAME__MAX_ATTEMPTS: ${GAME__MAX_ATTEMPTS:-3}
  GAME__MAX_HINTS: ${GAME__MAX_HINTS:-2}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-franky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-franky}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    # Миграции перед стартом: бот один, гонок нет, а отдельный одноразовый сервис
    # Coolify считал бы «упавшим».
    command: ["sh", "-c", "alembic upgrade head && exec franky bot"]
    environment: *app-env
    volumes:
      - audio:/app/data/audio
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  audio:
